<div id="{{ widget_id }}_container" class="multiple-input-container">
    {% for value in values %}
    <div class="input-row" draggable="true">
        <span class="drag-handle">⋮⋮</span>
        <input type="url" class="url-input" value="{{ value.link }}" placeholder="https://example.com">
        <select class="url-role-select">
            <option value="RAW" {% if value.role == "RAW" %}selected{% endif %}>RAW</option>
            <option value="MARKDOWN" {% if value.role == "MARKDOWN" %}selected{% endif %}>Markdown</option>
            <option value="PERMALINK" {% if value.role == "PERMALINK" %}selected{% endif %}>Permalink</option>
        </select>
        <button type="button" class="btn btn-sm btn-danger remove-input" aria-label="Remove URL">
            <i class="fas fa-times" aria-hidden="true"></i>
        </button>
    </div>
    {% endfor %}
    <div style="margin-bottom: 8px;">
        <button type="button" id="{{ widget_id }}_add" class="btn btn-sm btn-success add-widget-btn" aria-label="{{ button_label }}">
            <i class="fas fa-plus" aria-hidden="true"></i> {{ button_label }}
        </button>
    </div>
</div>
<input type="hidden" name="{{ name }}" id="{{ widget_id }}" value="{{ values_json }}">

<script>
window.initMultiWidget(
    '{{ widget_id }}_container',
    '{{ widget_id }}',
    'url',
    {
        rowTemplate: [
            '<span class="drag-handle">⋮⋮</span>',
            '<input type="url" class="url-input" placeholder="https://example.com">',
            '<select class="url-role-select">',
            '<option value="RAW" selected>RAW</option>',
            '<option value="MARKDOWN">Markdown</option>',
            '<option value="PERMALINK">Permalink</option>',
            '</select>',
            '<button type="button" class="btn btn-sm btn-danger remove-input" aria-label="Remove URL">',
            '<i class="fas fa-times" aria-hidden="true"></i>',
            '</button>'
        ].join(' ')
    }
);
</script>
